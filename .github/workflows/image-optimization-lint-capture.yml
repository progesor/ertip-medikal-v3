name: Capture Image Optimizer Lint Errors

on:
  push:
    branches:
      - feature/m7-image-delivery-optimization
    paths:
      - .github/workflows/image-optimization-lint-capture.yml

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_diagnostic
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal CI
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m7-image-delivery-optimization
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Capture lint output
        shell: bash
        run: |
          set +e
          pnpm lint > lint.log 2>&1
          status=$?
          mkdir -p docs/development
          cp lint.log docs/development/IMAGE_OPTIMIZATION_LINT_DIAGNOSTIC.txt
          printf '\nexit_status=%s\n' "$status" >> docs/development/IMAGE_OPTIMIZATION_LINT_DIAGNOSTIC.txt
          rm .github/workflows/image-optimization-lint-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/IMAGE_OPTIMIZATION_LINT_DIAGNOSTIC.txt .github/workflows/image-optimization-lint-capture.yml
          git commit -m "chore(images): capture lint diagnostics"
          git push origin HEAD:feature/m7-image-delivery-optimization
