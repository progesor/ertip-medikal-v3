name: Apply release gate patches

on:
  push:
    branches:
      - agent/production-hardening-release-gate

permissions:
  contents: write

concurrency:
  group: apply-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-release-gate
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Add Markdown HTML sanitization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/product/ProductView.tsx')
          text = path.read_text()
          if 'import rehypeSanitize from "rehype-sanitize";' not in text:
              text = text.replace(
                  'import rehypeRaw from "rehype-raw";\n',
                  'import rehypeRaw from "rehype-raw";\nimport rehypeSanitize from "rehype-sanitize";\n',
              )
          text = text.replace(
              'rehypePlugins={[rehypeRaw]}',
              'rehypePlugins={[rehypeRaw, rehypeSanitize]}',
          )
          path.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-release-gate-patches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src/components/product/ProductView.tsx .github/workflows/apply-release-gate-patches.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(security): sanitize product Markdown HTML"
          git push origin HEAD:agent/production-hardening-release-gate
