name: One-shot catalog performance optimization

on:
  push:
    branches:
      - agent/perf-catalog-delivery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/perf-catalog-delivery
          fetch-depth: 0
      - name: Apply performance patch
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              expected = count if count is not None else 1
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Product catalogue: avoid speculative dynamic product-page RSC requests,
          # make responsive sizing reflect the actual grid, and fix heading semantics.
          path = "src/app/(website)/urunler/page.tsx"
          replace(path,
              '<h3 className="mb-4 flex items-center gap-2 font-bold text-text-main">',
              '<h2 className="mb-4 flex items-center gap-2 font-bold text-text-main">',
              count=2,
          )
          replace(path, '</h3>', '</h2>', count=2)
          replace(path,
              'href={`/urunler/${product.slug}`}\n                        className="relative flex aspect-square items-center justify-center overflow-hidden bg-surface-muted/70 p-6"',
              'href={`/urunler/${product.slug}`}\n                        prefetch={false}\n                        className="relative flex aspect-square items-center justify-center overflow-hidden bg-surface-muted/70 p-6"',
          )
          replace(path,
              'sizes="(max-width: 640px) 100vw, (max-width: 1280px) 50vw, 33vw"',
              'sizes="(max-width: 639px) calc(100vw - 32px), (max-width: 1023px) calc(50vw - 28px), (max-width: 1279px) calc(37.5vw - 40px), 294px"',
          )
          replace(path,
              'href={`/urunler/${product.slug}`}\n                            className="text-text-main transition-colors hover:text-primary"',
              'href={`/urunler/${product.slug}`}\n                            prefetch={false}\n                            className="text-text-main transition-colors hover:text-primary"',
          )
          replace(path,
              '<Link href={`/urunler/${product.slug}`}>\n                            Ürünü İncele\n                          </Link>',
              '<Link href={`/urunler/${product.slug}`} prefetch={false}>\n                            Ürünü İncele\n                          </Link>',
          )

          # Homepage/product showcase: same product-detail prefetch policy and a
          # capped desktop image width for the max-width container.
          path = "src/components/blocks/FeaturedProductsBlock.tsx"
          replace(path,
              'href={`/urunler/${product.slug}`}\n                  className="relative aspect-square overflow-hidden bg-surface-muted p-6 flex items-center justify-center"',
              'href={`/urunler/${product.slug}`}\n                  prefetch={false}\n                  className="relative aspect-square overflow-hidden bg-surface-muted p-6 flex items-center justify-center"',
          )
          replace(path,
              'sizes="(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 25vw"',
              'sizes="(max-width: 639px) calc(100vw - 32px), (max-width: 1023px) calc(50vw - 28px), (max-width: 1279px) 25vw, 294px"',
          )
          replace(path,
              'href={`/urunler/${product.slug}`}\n                      className="hover:text-primary transition-colors text-text-main"',
              'href={`/urunler/${product.slug}`}\n                      prefetch={false}\n                      className="hover:text-primary transition-colors text-text-main"',
          )
          replace(path,
              '<Link href={`/urunler/${product.slug}`}>Ürünü İncele</Link>',
              '<Link href={`/urunler/${product.slug}`} prefetch={false}>Ürünü İncele</Link>',
          )

          # Header logo is tiny but was explicitly bypassing the existing image
          # delivery pipeline. Let Next/image use the custom loader.
          path = "src/components/layout/Header.tsx"
          replace(path,
              'className="h-10 w-auto object-contain"\n                  priority\n                  unoptimized',
              'className="h-10 w-auto object-contain"\n                  sizes="180px"\n                  quality={75}\n                  priority',
          )

          # PageSpeed accessibility findings: icon-only controls need names.
          path = "src/components/layout/HeaderActions.tsx"
          replace(path,
              'type="submit"\n          className="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary"',
              'type="submit"\n          aria-label="Ürün ara"\n          className="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary"',
          )
          replace(path,
              'href="/teklif-sepeti"\n        className="relative p-2 text-text-muted hover:text-primary transition-colors"',
              'href="/teklif-sepeti"\n        aria-label={cartItems.length > 0 ? `Teklif sepeti (${cartItems.length} ürün)` : "Teklif sepeti"}\n        className="relative p-2 text-text-muted hover:text-primary transition-colors"',
          )

          # Better default derivative ladder. Existing production values remain
          # untouched until an administrator saves these values and performs a
          # full rebuild, avoiding an unoptimized deploy window.
          path = "src/lib/imageOptimization/config.ts"
          replace(path, 'thumbnail: { width: 320, quality: 70 },', 'thumbnail: { width: 768, quality: 72 },')
          replace(path, 'card: { width: 900, quality: 75 },', 'card: { width: 960, quality: 75 },')
          replace(path, 'content: { width: 1_600, quality: 80 },', 'content: { width: 1_440, quality: 80 },')

          path = "src/globals/ImageOptimizationSettings.ts"
          replace(path,
              '"Logo, avatar ve küçük önizleme alanları.",',
              '"Logo, avatar, responsive katalog ve küçük önizleme alanları.",',
          )

          path = "docs/IMAGE_DELIVERY.md"
          replace(path, '| Thumbnail | 320 px | 70 | Avatars, logos and small previews |', '| Thumbnail | 768 px | 72 | Logos, responsive catalogue requests and small previews |')
          replace(path, '| Card | 900 px | 75 | Product, news and catalogue cards |', '| Card | 960 px | 75 | Product, news and medium card/detail requests |')
          replace(path, '| Content | 1600 px | 80 | Galleries, certificates and content images |', '| Content | 1440 px | 80 | Galleries, certificates and content images |')
          marker = 'Changing format, width or quality marks the current configuration as stale. The new settings do not become active until the administrator saves the global and runs **Tümünü Yeniden Oluştur**.\n'
          addition = marker + '\nFor existing installations, changing these code defaults does not overwrite saved CMS values. To adopt the balanced `768 / 960 / 1440 / 2400` ladder, enter those widths in **Site Yapılandırması → Görsel Optimizasyonu**, keep WebP unless there is a specific AVIF need, save, and run **Tümünü Yeniden Oluştur** once. The previous active derivatives remain in service until the settings are saved, so deployment itself does not create an unoptimized window.\n'
          replace(path, marker, addition)
          PY

          rm .github/workflows/zz-one-shot-perf-catalog.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf(catalog): reduce image and prefetch overfetch"
          git push origin HEAD:agent/perf-catalog-delivery
