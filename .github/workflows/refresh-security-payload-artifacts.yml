name: Refresh security Payload artifacts

on:
  push:
    branches: [agent/production-hardening-auth-api]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-auth-api
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm payload:types
      - run: pnpm payload:importmap
      - name: Remove one-shot workflow and commit generated artifacts
        run: |
          rm .github/workflows/refresh-security-payload-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payload-types.ts 'src/app/(payload)/admin/importMap.js' .github/workflows/refresh-security-payload-artifacts.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(payload): refresh security-generated artifacts"
          git push origin HEAD:agent/production-hardening-auth-api
