name: Apply M9 New Block Artifacts

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-m9-new-block-artifacts.yml

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_m9_apply
  PAYLOAD_SECRET: m9-new-block-artifacts-ci-secret
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal CI
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  apply:
    if: github.head_ref == 'agent/m9-new-content-blocks'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_m9_apply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_m9_apply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/m9-new-content-blocks
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply existing migrations
        run: pnpm db:migrate

      - name: Generate Payload artifacts
        run: |
          pnpm payload:types
          pnpm payload:importmap
          pnpm db:migrate:create m9_new_content_blocks

      - name: Verify generated artifacts
        run: |
          test -f src/payload-types.ts
          test -f 'src/app/(payload)/admin/importMap.js'
          test -n "$(find src/migrations -maxdepth 1 -type f -name '*_m9_new_content_blocks.ts' -print -quit)"
          test -n "$(find src/migrations -maxdepth 1 -type f -name '*_m9_new_content_blocks.json' -print -quit)"

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payload-types.ts 'src/app/(payload)/admin/importMap.js' src/migrations
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
            exit 1
          fi
          git commit -m "chore(cms): commit M9 new block schema artifacts"
          git push origin HEAD:agent/m9-new-content-blocks
