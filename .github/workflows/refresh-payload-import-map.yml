name: Refresh Payload import map

on:
  push:
    branches:
      - agent/production-hardening-dependencies

permissions:
  contents: write

concurrency:
  group: refresh-payload-import-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-dependencies
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm payload:importmap
      - name: Commit import map when changed
        run: |
          if git diff --quiet -- 'src/app/(payload)/admin/importMap.js'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(payload)/admin/importMap.js'
          git commit -m "chore(payload): refresh admin import map"
          git push origin HEAD:agent/production-hardening-dependencies
