name: Generate MediaTextBlock Layout Artifacts

on:
  push:
    branches:
      - agent/media-text-layouts
    paths:
      - .github/workflows/generate-media-text-layouts.yml

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_media_text_layouts
  PAYLOAD_SECRET: media-text-layouts-ci-secret-value
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal CI
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_media_text_layouts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_media_text_layouts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/media-text-layouts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply committed migrations
        run: pnpm db:migrate

      - name: Generate Payload types and import map
        run: |
          pnpm payload:types
          pnpm payload:importmap

      - name: Create layout migration
        run: pnpm db:migrate:create media_text_layouts

      - name: Verify code quality
        run: |
          pnpm typecheck
          pnpm lint

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payload-types.ts 'src/app/(payload)/admin/importMap.js' src/migrations
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
            exit 0
          fi
          git commit -m "chore(cms): commit MediaTextBlock layout artifacts"
          git push origin HEAD:agent/media-text-layouts
