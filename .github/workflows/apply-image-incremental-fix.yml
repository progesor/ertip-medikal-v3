name: Apply Image Incremental Fix

on:
  push:
    branches:
      - agent/image-incremental-optimization-fix
    paths:
      - .github/workflows/apply-image-incremental-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/image-incremental-optimization-fix

      - name: Apply targeted corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              content = file_path.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              file_path.write_text(content.replace(old, new, 1))

          control = "src/components/admin/ImageOptimizationControl.tsx"
          replace_once(
              control,
              "  const runOptimization = async () => {",
              "  const runOptimization = async (force: boolean) => {",
          )
          replace_once(
              control,
              '''    const confirmed = window.confirm(
              "Kaydedilmiş boyut ve kalite ayarlarıyla tüm görseller yeniden oluşturulacak. Orijinal dosyalar değiştirilmeyecek. Devam edilsin mi?",
            );''',
              '''    const confirmed = window.confirm(
              force
                ? "Kaydedilmiş boyut ve kalite ayarlarıyla tüm görseller yeniden oluşturulacak. Orijinal dosyalar değiştirilmeyecek. Devam edilsin mi?"
                : "Yalnızca optimize türevi eksik olan yeni veya değişen görseller işlenecek. Hazır türevler yeniden oluşturulmadan atlanacak. Devam edilsin mi?",
            );''',
          )
          replace_once(
              control,
              '    setProgressMessage("Kaydedilmiş ayarlar okunuyor...");',
              '''    setProgressMessage(
              force
                ? "Tüm görseller için ayarlar okunuyor..."
                : "Yeni ve değişen görseller kontrol ediliyor...",
            );''',
          )
          replace_once(control, "            force: true,", "            force,")
          replace_once(
              control,
              '''            Ardından bu düğme tüm raster görseller için kırpmasız ve kalıcı
            türevler üretir. PDF, SVG ve hareketli GIF dosyaları değiştirilmez.''',
              '''            Ardından yeni veya değişen raster görselleri artımlı olarak
            optimize edin. Gerektiğinde tüm türevleri yeniden oluşturabilirsiniz. PDF,
            SVG ve hareketli GIF dosyaları değiştirilmez.''',
          )
          replace_once(
              control,
              '''        <button
          type="button"
          onClick={() => void runOptimization()}
          disabled={isRunning}
          style={{
            ...styles.actionButton,
            cursor: isRunning ? "not-allowed" : "pointer",
            opacity: isRunning ? 0.6 : 1,
          }}
        >
          {isRunning ? "Görseller İşleniyor..." : "Tüm Görselleri Optimize Et"}
        </button>''',
              '''        <div style={styles.actionGroup}>
          <button
            type="button"
            onClick={() => void runOptimization(false)}
            disabled={isRunning}
            style={{
              ...styles.actionButton,
              cursor: isRunning ? "not-allowed" : "pointer",
              opacity: isRunning ? 0.6 : 1,
            }}
          >
            {isRunning
              ? "Görseller İşleniyor..."
              : "Yeni / Değişenleri Optimize Et"}
          </button>
          <button
            type="button"
            onClick={() => void runOptimization(true)}
            disabled={isRunning}
            style={{
              ...styles.secondaryActionButton,
              cursor: isRunning ? "not-allowed" : "pointer",
              opacity: isRunning ? 0.6 : 1,
            }}
          >
            Tümünü Yeniden Oluştur
          </button>
        </div>''',
          )
          replace_once(
              control,
              '''  descriptionColumn: {
    maxWidth: "720px",
  },''',
              '''  descriptionColumn: {
    maxWidth: "720px",
  },
  actionGroup: {
    display: "flex",
    flexWrap: "wrap",
    justifyContent: "flex-end",
    gap: "0.65rem",
  },''',
          )
          replace_once(
              control,
              '''  actionButton: {
    border: 0,
    borderRadius: "8px",
    padding: "0.8rem 1.1rem",
    background: "var(--theme-success-500, #15803d)",
    color: "white",
    fontWeight: 700,
  },''',
              '''  actionButton: {
    border: 0,
    borderRadius: "8px",
    padding: "0.8rem 1.1rem",
    background: "var(--theme-success-500, #15803d)",
    color: "white",
    fontWeight: 700,
  },
  secondaryActionButton: {
    border: "1px solid var(--theme-elevation-250)",
    borderRadius: "8px",
    padding: "0.8rem 1.1rem",
    background: "var(--theme-elevation-0)",
    color: "var(--theme-elevation-800)",
    fontWeight: 700,
  },''',
          )

          replace_once(
              "src/components/blocks/HeroBlock.tsx",
              "backgroundImage?.sizes?.hero?.url || backgroundImage?.url || null",
              "backgroundImage?.url || backgroundImage?.sizes?.hero?.url || null",
          )
          replace_once(
              "src/components/blocks/HeroSliderBlock.tsx",
              "slide.image?.sizes?.hero?.url || slide.image?.url || null",
              "slide.image?.url || slide.image?.sizes?.hero?.url || null",
          )
          replace_once(
              "src/app/(website)/urunler/page.tsx",
              '''    product.mainImage.sizes?.card?.url ||
    product.mainImage.url ||''',
              '''    product.mainImage.url ||
    product.mainImage.sizes?.card?.url ||''',
          )

          replace_once(
              "src/app/(website)/[slug]/page.tsx",
              '''import {NewsFeedBlock} from "@/components/blocks/NewsFeedBlock";

type Args = {''',
              '''import {NewsFeedBlock} from "@/components/blocks/NewsFeedBlock";

export const dynamic = "force-dynamic";

type Args = {''',
          )
          replace_once(
              "src/app/(website)/page.tsx",
              '''import { NewsFeedBlock } from "@/components/blocks/NewsFeedBlock";

export const metadata: Metadata = {''',
              '''import { NewsFeedBlock } from "@/components/blocks/NewsFeedBlock";

export const dynamic = "force-dynamic";

export const metadata: Metadata = {''',
          )

          replace_once(
              "src/collections/Media.ts",
              '''`${filename || "Bir görsel"} değişti. Güncel türevleri üretmek için toplu optimizasyonu yeniden çalıştırın.`,''',
              '''`${filename || "Bir görsel"} değişti. Güncel türevleri üretmek için yeni/değişen görseller optimizasyonunu çalıştırın.`,''',
          )

          docs = Path("docs/IMAGE_DELIVERY.md")
          content = docs.read_text()
          content = content.replace(
              "3. The administrator explicitly runs **Tüm Görselleri Optimize Et** to create persistent, aspect-ratio-safe derivatives.",
              "3. The administrator runs **Yeni / Değişenleri Optimize Et** for incremental updates, or **Tümünü Yeniden Oluştur** after a configuration-wide change.",
          )
          content = content.replace(
              "4. Click **Tüm Görselleri Optimize Et**.\n5. Keep the page open while the progress indicator advances.\n6. Review the processed, skipped and error counts.",
              "4. Click **Yeni / Değişenleri Optimize Et** for routine uploads and replacements. Existing complete derivatives are detected and skipped.\n5. Use **Tümünü Yeniden Oluştur** only when every derivative must be regenerated.\n6. Keep the page open while the progress indicator advances.\n7. Review the processed, skipped and error counts.",
          )
          content = content.replace(
              "10. Re-run optimization and confirm the new image receives generated variants.",
              "10. Run **Yeni / Değişenleri Optimize Et** and confirm only the new image is processed while existing derivatives are skipped.",
          )
          docs.write_text(content)
          PY

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/admin/ImageOptimizationControl.tsx \
            src/components/blocks/HeroBlock.tsx \
            src/components/blocks/HeroSliderBlock.tsx \
            'src/app/(website)/urunler/page.tsx' \
            'src/app/(website)/[slug]/page.tsx' \
            'src/app/(website)/page.tsx' \
            src/collections/Media.ts \
            docs/IMAGE_DELIVERY.md
          git commit -m "fix(images): support incremental optimization and fresh CMS media"
          git push origin HEAD:agent/image-incremental-optimization-fix
