name: Fix generated import map key
on:
  push:
    branches: [agent/production-hardening-dependencies]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-dependencies
      - name: Correct generated key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/(payload)/admin/importMap.js')
          s = p.read_text()
          s = s.replace('"/components/admin/AdminNavFooter": AdminNavFooter_', '"/components/admin/AdminBrand#AdminNavFooter": AdminNavFooter_')
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-importmap-key.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(payload)/admin/importMap.js' .github/workflows/fix-importmap-key.yml
          git commit -m "chore(payload): align generated import map"
          git push origin HEAD:agent/production-hardening-dependencies
