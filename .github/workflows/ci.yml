name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm payload:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- src/payload-types.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_ci
      PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM_NAME: Ertip Medikal CI
      SMTP_FROM_ADDRESS: ci@example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with diagnostic fallback
        shell: bash
        run: |
          pnpm build || {
            echo "Normal production build failed; rerunning with Next.js prerender diagnostics."
            pnpm build:debug
            exit 1
          }
