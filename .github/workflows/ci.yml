name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_ci
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal CI
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  quality:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm payload:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- src/payload-types.ts

      - name: Upload generated Payload types on drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-payload-types
          path: src/payload-types.ts
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  production-build:
    name: Migrations and production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify committed migration baseline
        run: |
          test -f src/migrations/index.ts
          test "$(find src/migrations -maxdepth 1 -type f -name '*.ts' ! -name 'index.ts' | wc -l)" -ge 1
          test "$(find src/migrations -maxdepth 1 -type f -name '*.json' | wc -l)" -ge 1

      - name: Apply committed migrations to disposable database
        run: pnpm db:migrate

      - name: Verify migration status
        run: pnpm db:migrate:status

      - name: Simulate existing production migration history
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URI });
          await client.connect();
          try {
            await client.query("DELETE FROM payload_migrations");
            await client.query(
              `INSERT INTO payload_migrations (name, batch, created_at, updated_at)
               VALUES ('development-push-marker', -1, now(), now())`,
            );
          } finally {
            await client.end();
          }
          NODE

      - name: Verify baseline adoption preflight
        run: pnpm db:baseline:check

      - name: Exercise confirmed baseline adoption
        env:
          MIGRATION_BASELINE_ADOPT: 20260727_101107_production_baseline
        run: pnpm db:baseline:adopt

      - name: Verify adopted migration status
        run: pnpm db:migrate:status

      - name: Detect uncommitted schema migration drift
        id: migration-drift
        shell: bash
        run: |
          set +e
          before_count=$(find src/migrations -maxdepth 1 -type f -name '*.ts' ! -name 'index.ts' | wc -l)
          pnpm db:migrate:create ci-schema-drift --skip-empty
          create_status=$?
          after_count=$(find src/migrations -maxdepth 1 -type f -name '*.ts' ! -name 'index.ts' | wc -l)

          if [[ $create_status -ne 0 ]]; then
            echo "Migration drift command failed."
            exit $create_status
          fi

          if [[ $before_count -ne $after_count ]] || ! git diff --quiet -- src/migrations; then
            echo "Payload config changed without a committed migration."
            git status --short src/migrations
            exit 1
          fi

      - name: Upload migration drift diagnostics
        if: failure() && steps.migration-drift.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-migration-drift
          path: src/migrations
          if-no-files-found: error
          retention-days: 7

      - name: Build with diagnostic fallback
        id: production-build
        shell: bash
        run: |
          set +e
          set -o pipefail

          pnpm build 2>&1 | tee production-build.log
          build_status=${PIPESTATUS[0]}

          if [[ $build_status -ne 0 ]]; then
            echo "Normal production build failed; rerunning with Next.js prerender diagnostics." | tee -a production-build.log
            pnpm build:debug 2>&1 | tee -a production-build.log
            debug_status=${PIPESTATUS[0]}
            echo "normal_build_status=$build_status" >> "$GITHUB_OUTPUT"
            echo "debug_build_status=$debug_status" >> "$GITHUB_OUTPUT"
            exit $build_status
          fi

          echo "normal_build_status=0" >> "$GITHUB_OUTPUT"
          echo "debug_build_status=not-run" >> "$GITHUB_OUTPUT"

      - name: Upload production build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: production-build.log
          if-no-files-found: error
          retention-days: 7
