name: M7 Generate SKU Artifacts

on:
  push:
    branches:
      - agent/m7-configurable-sku-rules
    paths:
      - .github/workflows/m7-generate-sku-artifacts.yml

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_ci
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal CI
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/m7-configurable-sku-rules
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types and import map
        run: |
          pnpm payload:types
          pnpm payload:importmap

      - name: Generate canonical migration and snapshot
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:migrate:create m7-generated-snapshot --skip-empty

          generated_ts=$(find src/migrations -maxdepth 1 -type f -name '*_m7_generated_snapshot.ts' | head -n 1)
          generated_json=$(find src/migrations -maxdepth 1 -type f -name '*_m7_generated_snapshot.json' | head -n 1)

          test -n "$generated_ts"
          test -n "$generated_json"

          cp "$generated_ts" src/migrations/20260728_101500_configurable_sku_rules.ts
          cp "$generated_json" src/migrations/20260728_101500_configurable_sku_rules.json
          rm "$generated_ts" "$generated_json"

          cat > src/migrations/index.ts <<'INDEX'
          import * as migration_20260727_101107_production_baseline from './20260727_101107_production_baseline';
          import * as migration_20260727_131359_image_optimization_settings from './20260727_131359_image_optimization_settings';
          import * as migration_20260728_101500_configurable_sku_rules from './20260728_101500_configurable_sku_rules';

          export const migrations = [
            {
              up: migration_20260727_101107_production_baseline.up,
              down: migration_20260727_101107_production_baseline.down,
              name: '20260727_101107_production_baseline',
            },
            {
              up: migration_20260727_131359_image_optimization_settings.up,
              down: migration_20260727_131359_image_optimization_settings.down,
              name: '20260727_131359_image_optimization_settings'
            },
            {
              up: migration_20260728_101500_configurable_sku_rules.up,
              down: migration_20260728_101500_configurable_sku_rules.down,
              name: '20260728_101500_configurable_sku_rules'
            },
          ];
          INDEX

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/payload-types.ts \
            'src/app/(payload)/admin/importMap.js' \
            src/migrations/20260728_101500_configurable_sku_rules.ts \
            src/migrations/20260728_101500_configurable_sku_rules.json \
            src/migrations/index.ts

          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi

          git commit -m "chore(sku): commit generated Payload artifacts"
          git push origin HEAD:agent/m7-configurable-sku-rules
