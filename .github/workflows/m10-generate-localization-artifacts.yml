name: M10 Localization Migration Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_m10
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal M10
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_m10
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_m10"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply existing committed migrations
        run: pnpm db:migrate

      - name: Probe interactive localization migration
        shell: bash
        run: |
          set +e
          timeout 20s script -q -e -c "pnpm db:migrate:create m10-multilingual-foundation" migration-session.log
          status=$?
          echo "--- migration interactive transcript ---"
          cat migration-session.log
          echo "--- end transcript ---"
          if [[ $status -eq 124 ]]; then
            echo "Probe timed out after exposing the interactive prompt as expected."
            exit 1
          fi
          exit $status

      - name: Upload prompt transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-localization-migration-prompt
          path: migration-session.log
          if-no-files-found: warn
          retention-days: 7
