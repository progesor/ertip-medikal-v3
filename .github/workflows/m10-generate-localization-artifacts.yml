          );

          INSERT INTO "_pages_v" (
            "parent_id", "version_title", "version_meta_title", "version_meta_description",
            "version_meta_image_id", "version_meta_keywords", "version_slug",
            "version__status", "latest"
          ) VALUES (
            1, 'Türkçe Sayfa Sürümü', 'Türkçe Sayfa Sürüm SEO',
            'Türkçe sayfa sürüm SEO açıklaması', 1, 'sayfa,sürüm',
            'turkce-sayfa', 'published', true
          );

          INSERT INTO "_pages_v_blocks_content" (
            "_order", "_parent_id", "_path", "content", "_uuid", "block_name"
          ) VALUES (
            1, 1, 'version_layout', '{"root":{"type":"root","children":[]}}'::jsonb,
            'm10-version-page-content', 'Türkçe Sürüm İçeriği'
          );

          INSERT INTO "site_settings" (
            "general_site_logo_id", "header_header_company_name", "header_header_tagline",
            "header_header_cta_label", "header_header_cta_href", "floating_action_label",
            "floating_action_helper_text", "floating_action_phone_number",
            "floating_action_message", "footer_copyright"
          ) VALUES (
            1, 'Ertip Medikal TR', 'Türkçe Slogan', 'Bize Ulaşın', '/iletisim',
            'WhatsApp ile İletişim', 'Size nasıl yardımcı olabiliriz?', '905551112233',
            'Merhaba, ürünleriniz hakkında bilgi almak istiyorum.',
            '© 2026 Ertip Medikal. Tüm Hakları Saklıdır.'
          );

          INSERT INTO "site_settings_blocks_text_column" (
            "_order", "_parent_id", "_path", "id", "show_logo", "text", "block_name"
          ) VALUES (1, 1, 'footer.columns', 'm10-footer-text', true, 'Türkçe footer açıklaması', 'Footer');

          INSERT INTO "site_settings_footer_bottom_links" (
            "_order", "_parent_id", "id", "label", "url"
          ) VALUES (1, 1, 'm10-footer-link', 'Gizlilik', '/gizlilik');

          INSERT INTO "main_menu" DEFAULT VALUES;
          INSERT INTO "main_menu_items" (
            "_order", "_parent_id", "id", "label", "type", "url"
          ) VALUES (1, 1, 'm10-menu-item', 'Ürünler', 'custom', '/urunler');
          SQL

      - name: Generate structural localization migration
        shell: bash
        run: |
          cat > /tmp/generate.expect <<'EXPECT'
          set timeout 90
          log_user 1
          log_file -a migration-session.log
          spawn pnpm db:migrate:create m10-multilingual-foundation --force-accept-warning
          expect {
            -re {created or renamed[^\?]*\?} {
              send "\r"
              exp_continue
            }
            -re {create or rename[^\?]*\?} {
              send "\r"
              exp_continue
            }
            -re {Do you want to continue\?} {
              send "y\r"
              exp_continue
            }
            eof {
              catch wait result
              set exitCode [lindex $result 3]
              exit $exitCode
            }
            timeout {
              puts "ERROR: localization migration generation timed out"
              send "\003"
              expect eof
              exit 24
            }
          }
          EXPECT
          expect /tmp/generate.expect

      - name: Add Turkish data-preservation layer
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          migrations = sorted(Path('src/migrations').glob('*_m10_multilingual_foundation.ts'))
          if len(migrations) != 1:
              raise SystemExit(f'Expected one M10 migration, found {len(migrations)}')

          path = migrations[0]
          source = path.read_text()

          altered_locale_tables = re.findall(
              r'ALTER TABLE "([^"]+)" ADD COLUMN "_locale" "_locales" NOT NULL;',
              source,
          )
          if len(altered_locale_tables) < 70:
              raise SystemExit(
                  f'Unexpected localized child-table count: {len(altered_locale_tables)}'
              )

          # Existing rows cannot accept a new NOT NULL column until they have
          # explicitly been assigned to the legacy Turkish locale.
          source = source.replace(
              'ADD COLUMN "_locale" "_locales" NOT NULL;',
              'ADD COLUMN "_locale" "_locales";',
          )

          locale_sources = {
              'products_locales': 'products',
              '_products_v_locales': '_products_v',
              'categories_locales': 'categories',
              'news_locales': 'news',
              '_news_v_locales': '_news_v',
              'pages_locales': 'pages',
              '_pages_v_locales': '_pages_v',
              'news_categories_locales': 'news_categories',
              'site_settings_locales': 'site_settings',
          }

          copy_statements = []
          for locale_table, legacy_table in locale_sources.items():
              match = re.search(
                  rf'CREATE TABLE "{re.escape(locale_table)}" \((.*?)\n  \);',
                  source,
                  re.S,
              )
              if not match:
                  raise SystemExit(f'Could not parse {locale_table}')

              columns = re.findall(r'^\s*"([^"]+)"\s+', match.group(1), re.M)
              content_columns = [
                  column
                  for column in columns
                  if column not in {'id', '_locale', '_parent_id'}
              ]
              quoted_columns = ', '.join(f'"{column}"' for column in content_columns)
              select_columns = ', '.join(f'"{column}"' for column in content_columns)
              copy_statements.append(
                  f'''INSERT INTO "{locale_table}" ({quoted_columns}, "_locale", "_parent_id")\n'''
                  f'''SELECT {select_columns}, 'tr'::"_locales", "id" FROM "{legacy_table}";'''
              )

          child_locale_statements = []
          for table in altered_locale_tables:
              child_locale_statements.extend([
                  f'''UPDATE "{table}" SET "_locale" = 'tr'::"_locales" WHERE "_locale" IS NULL;''',
                  f'''ALTER TABLE "{table}" ALTER COLUMN "_locale" SET NOT NULL;''',
              ])

          relationship_locale_statements = [
              '''UPDATE "pages_rels" SET "locale" = 'tr'::"_locales" WHERE "locale" IS NULL;''',
              '''UPDATE "_pages_v_rels" SET "locale" = 'tr'::"_locales" WHERE "locale" IS NULL;''',
          ]

          preservation = '\n  -- M10 data preservation: all legacy content is Turkish.\n  '
          preservation += '\n  '.join(
              copy_statements + child_locale_statements + relationship_locale_statements
          )
          preservation += '\n  '

          marker = 'ALTER TABLE "products" DROP COLUMN "title";'
          if source.count(marker) != 1:
              raise SystemExit('Unexpected product drop marker count')
          source = source.replace(marker, preservation + marker, 1)

          # A downgrade after editors create English rows cannot safely collapse
          # two locales back into one schema. Production policy already forbids
          # migrate:down; make that boundary explicit instead of silently losing data.
          down_marker = 'export async function down({ db, payload, req }: MigrateDownArgs): Promise<void> {'
          down_index = source.find(down_marker)
          if down_index < 0:
              raise SystemExit('Down migration marker not found')
          source = source[:down_index] + '''export async function down({ db, payload, req }: MigrateDownArgs): Promise<void> {\n  throw new Error(\n    "M10 multilingual localization is intentionally irreversible. Restore the pre-migration PostgreSQL backup instead of running migrate:down.",\n  )\n}\n'''

          path.write_text(source)
          print(f'Patched {path} with Turkish preservation for {len(altered_locale_tables)} child tables.')
          PY

      - name: Apply safe localization migration to seeded legacy database
        run: pnpm db:migrate

      - name: Verify Turkish content survived localization
        shell: bash
        run: |
          psql "$DATABASE_URI" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT "title" FROM "products_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe Ürün' THEN
              RAISE EXCEPTION 'Product Turkish title was not preserved';
            END IF;
            IF (SELECT "short_description" FROM "products_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe kısa açıklama' THEN
              RAISE EXCEPTION 'Product Turkish short description was not preserved';
            END IF;
            IF (SELECT "slug" FROM "products_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'turkce-urun' THEN
              RAISE EXCEPTION 'Product Turkish slug was not preserved';
            END IF;
            IF (SELECT "sku" FROM "products" WHERE "id" = 1) IS DISTINCT FROM 'M10-SKU' THEN
              RAISE EXCEPTION 'Shared product SKU changed';
            END IF;
            IF (SELECT "_locale"::text FROM "products_specs" WHERE "id" = 'm10-spec') IS DISTINCT FROM 'tr' THEN
              RAISE EXCEPTION 'Product specs were not assigned to Turkish';
            END IF;
            IF (SELECT "version_title" FROM "_products_v_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe Ürün Sürümü' THEN
              RAISE EXCEPTION 'Product version Turkish title was not preserved';
            END IF;
            IF (SELECT "_locale"::text FROM "_products_v_version_specs" WHERE "_parent_id" = 1 LIMIT 1) IS DISTINCT FROM 'tr' THEN
              RAISE EXCEPTION 'Product version specs were not assigned to Turkish';
            END IF;
            IF (SELECT "title" FROM "categories_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe Kategori' THEN
              RAISE EXCEPTION 'Category Turkish content was not preserved';
            END IF;
            IF (SELECT "title" FROM "news_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe Haber' THEN
              RAISE EXCEPTION 'News Turkish content was not preserved';
            END IF;
            IF (SELECT "version_title" FROM "_news_v_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe Haber Sürümü' THEN
              RAISE EXCEPTION 'News version Turkish content was not preserved';
            END IF;
            IF (SELECT "title" FROM "pages_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe Sayfa' THEN
              RAISE EXCEPTION 'Page Turkish content was not preserved';
            END IF;
            IF (SELECT "_locale"::text FROM "pages_blocks_content" WHERE "id" = 'm10-page-content') IS DISTINCT FROM 'tr' THEN
              RAISE EXCEPTION 'Page Builder content was not assigned to Turkish';
            END IF;
            IF (SELECT "version_title" FROM "_pages_v_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe Sayfa Sürümü' THEN
              RAISE EXCEPTION 'Page version Turkish content was not preserved';
            END IF;
            IF (SELECT "_locale"::text FROM "_pages_v_blocks_content" WHERE "_parent_id" = 1 LIMIT 1) IS DISTINCT FROM 'tr' THEN
              RAISE EXCEPTION 'Page version blocks were not assigned to Turkish';
            END IF;
            IF (SELECT "title" FROM "news_categories_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Türkçe Haber Kategorisi' THEN
              RAISE EXCEPTION 'News category Turkish content was not preserved';
            END IF;
            IF (SELECT "header_header_company_name" FROM "site_settings_locales" WHERE "_parent_id" = 1 AND "_locale" = 'tr') IS DISTINCT FROM 'Ertip Medikal TR' THEN
              RAISE EXCEPTION 'Site settings Turkish content was not preserved';
            END IF;
            IF (SELECT "_locale"::text FROM "site_settings_blocks_text_column" WHERE "id" = 'm10-footer-text') IS DISTINCT FROM 'tr' THEN
              RAISE EXCEPTION 'Footer block was not assigned to Turkish';
            END IF;
            IF (SELECT "_locale"::text FROM "site_settings_footer_bottom_links" WHERE "id" = 'm10-footer-link') IS DISTINCT FROM 'tr' THEN
              RAISE EXCEPTION 'Footer link was not assigned to Turkish';
            END IF;
            IF (SELECT "_locale"::text FROM "main_menu_items" WHERE "id" = 'm10-menu-item') IS DISTINCT FROM 'tr' THEN
              RAISE EXCEPTION 'Main menu item was not assigned to Turkish';
            END IF;
            IF EXISTS (SELECT 1 FROM "products_locales" WHERE "_locale" = 'en') THEN
              RAISE EXCEPTION 'English product locale was incorrectly pre-populated';
            END IF;
            IF EXISTS (SELECT 1 FROM "pages_locales" WHERE "_locale" = 'en') THEN
              RAISE EXCEPTION 'English page locale was incorrectly pre-populated';
            END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'products' AND column_name = 'title'
            ) THEN
              RAISE EXCEPTION 'Legacy product title column still exists after localization';
            END IF;
          END $$;
          SQL

      - name: Verify migration status
        run: pnpm db:migrate:status

      - name: Generate Payload types
        run: pnpm payload:types

      - name: Generate Payload import map
        run: pnpm payload:importmap

      - name: Commit safe generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/migrations src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
          if git diff --cached --quiet; then
            echo 'No generated localization artifacts changed.'
            exit 0
          fi
          git commit -m 'chore(m10): generate safe localization artifacts'
          git push origin HEAD:agent/m10-multilingual-foundation

      - name: Upload verified localization artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-localization-verified-artifacts
          path: |
            migration-session.log
            src/migrations
            src/payload-types.ts
            src/app/(payload)/admin/importMap.js
          if-no-files-found: warn
          retention-days: 7
