name: M10 Localization Migration Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_COLOR: "0"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_m10
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal M10
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_m10
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_m10"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install expect
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect

      - name: Apply existing committed migrations
        run: pnpm db:migrate

      - name: Probe second localization migration decision
        shell: bash
        run: |
          cat > /tmp/probe.expect <<'EXPECT'
          set timeout 30
          log_user 1
          log_file -a migration-session.log
          spawn pnpm db:migrate:create m10-multilingual-foundation

          # First ambiguity: _products_v.snapshot is a genuinely new Payload
          # version snapshot column. Keep the default "create column" choice.
          expect {
            -re {created or renamed from another column\?} {
              send "\r"
            }
            timeout {
              puts "ERROR: first migration decision prompt was not observed"
              exit 20
            }
            eof {
              puts "ERROR: migration exited before first decision"
              exit 21
            }
          }

          # Stop at the second ambiguity so we can review it before answering.
          expect {
            -re {created or renamed from another column\?} {
              puts "\nPROBE_REACHED_SECOND_DECISION"
              send "\003"
              expect eof
              exit 42
            }
            timeout {
              puts "ERROR: second migration decision prompt was not observed"
              send "\003"
              expect eof
              exit 22
            }
            eof {
              puts "ERROR: migration exited before second decision"
              exit 23
            }
          }
          EXPECT

          set +e
          expect /tmp/probe.expect
          status=$?
          set -e
          echo "--- migration interactive transcript ---"
          cat migration-session.log
          echo "--- end transcript ---"
          if [[ $status -eq 42 ]]; then
            echo "Second migration decision exposed successfully."
            exit 1
          fi
          exit $status

      - name: Upload prompt transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-localization-migration-prompt
          path: migration-session.log
          if-no-files-found: warn
          retention-days: 7
