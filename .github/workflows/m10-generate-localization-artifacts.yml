            "title", "excerpt", "content", "image_id", "meta_title",
            "meta_description", "meta_image_id", "meta_keywords", "category_id",
            "published_date", "slug", "_status"
          ) VALUES (
            'Türkçe Haber', 'Türkçe haber özeti', '{"root":{"type":"root","children":[]}}'::jsonb,
            1, 'Türkçe Haber SEO', 'Türkçe haber SEO açıklaması', 1, 'haber,türkçe',
