name: M10 Localization Migration Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_COLOR: "0"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_m10
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal M10
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  build-and-verify:
    if: github.event.pull_request.head.ref == 'agent/m10-multilingual-foundation'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_m10
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_m10"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/m10-multilingual-foundation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install migration probe tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect postgresql-client

      - name: Apply existing committed migrations
        run: pnpm db:migrate

      - name: Seed representative Turkish legacy content
