name: M10 Localization Migration Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"
  FORCE_COLOR: "0"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_m10
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal M10
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_m10
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_m10"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install expect
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect

      - name: Apply existing committed migrations
        run: pnpm db:migrate

      - name: Generate structural all-create migration probe
        shell: bash
        run: |
          cat > /tmp/probe.expect <<'EXPECT'
          set timeout 90
          log_user 1
          log_file -a migration-session.log
          spawn pnpm db:migrate:create m10-multilingual-foundation --force-accept-warning

          # This is intentionally a structural probe, not the final production
          # migration. For every Drizzle create-vs-rename ambiguity, select the
          # default create option. We will inspect and augment the generated SQL
          # with explicit Turkish data-copy statements before accepting it.
          expect {
            -re {created or renamed[^\?]*\?} {
              send "\r"
              exp_continue
            }
            -re {create or rename[^\?]*\?} {
              send "\r"
              exp_continue
            }
            -re {Do you want to continue\?} {
              send "y\r"
              exp_continue
            }
            eof {
              catch wait result
              set exitCode [lindex $result 3]
              exit $exitCode
            }
            timeout {
              puts "ERROR: localization migration probe timed out"
              send "\003"
              expect eof
              exit 24
            }
          }
          EXPECT

          expect /tmp/probe.expect
          echo "--- generated migration files ---"
          git status --short src/migrations
          echo "--- end generated migration files ---"

      - name: Generate Payload types
        run: pnpm payload:types

      - name: Generate Payload import map
        run: pnpm payload:importmap

      - name: Upload generated localization probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10-localization-generated-probe
          path: |
            migration-session.log
            src/migrations
            src/payload-types.ts
            src/app/(payload)/admin/importMap.js
          if-no-files-found: warn
          retention-days: 7
