name: Image Optimization Typecheck Diagnostic

on:
  push:
    branches:
      - feature/m7-image-delivery-optimization
    paths:
      - .github/workflows/image-optimization-typecheck-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_diagnostic
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal CI
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m7-image-delivery-optimization
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Capture typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist diagnostics and remove workflow
        shell: bash
        run: |
          mkdir -p docs/development
          cp typecheck.log docs/development/IMAGE_OPTIMIZATION_TYPECHECK_DIAGNOSTIC.txt
          rm .github/workflows/image-optimization-typecheck-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/IMAGE_OPTIMIZATION_TYPECHECK_DIAGNOSTIC.txt .github/workflows/image-optimization-typecheck-diagnostic.yml
          git commit -m "chore(images): capture typecheck diagnostics"
          git push origin HEAD:feature/m7-image-delivery-optimization

      - name: Preserve failure result
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
