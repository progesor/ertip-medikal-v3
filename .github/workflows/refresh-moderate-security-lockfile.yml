name: Refresh moderate security lockfile
on:
  push:
    branches: [agent/production-hardening-release-gate]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-release-gate
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --lockfile-only
      - name: Remove workflow and commit lockfile
        run: |
          rm .github/workflows/refresh-moderate-security-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/refresh-moderate-security-lockfile.yml
          git commit -m "chore(security): refresh moderate-advisory lockfile"
          git push origin HEAD:agent/production-hardening-release-gate
