name: Rebuild auth hardening branch

on:
  push:
    branches: [agent/production-hardening-auth-api-v2]
    paths:
      - ".github/workflows/rebuild-auth-hardening-v2.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-auth-api-v2
          fetch-depth: 0
      - name: Fetch source hardening branch
        run: git fetch origin agent/production-hardening-auth-api:refs/remotes/origin/agent/production-hardening-auth-api
      - name: Copy only auth/API hardening files
        run: |
          git checkout origin/agent/production-hardening-auth-api -- \
            docs/ENVIRONMENT_AND_SECRETS.md \
            docs/development/PRODUCTION_AUTH_API_HARDENING_2026-08-03.md \
            next.config.mjs \
            'src/app/api/verify-manual/route.ts' \
            src/collections/DownloadLogs.ts \
            src/collections/Media.ts \
            src/collections/Users.ts \
            src/components/product/ProductView.tsx \
            src/lib/security/protectedDownloadToken.ts \
            src/lib/security/publicRequest.ts \
            src/migrations/20260803_060000_redact_download_access_codes.ts \
            src/migrations/index.ts \
            src/payload.config.ts
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/rebuild-auth-hardening-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): rebuild auth and API hardening on dependency baseline"
          git push origin HEAD:agent/production-hardening-auth-api-v2
