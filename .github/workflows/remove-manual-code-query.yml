name: Remove protected code query handling

on:
  push:
    branches:
      - agent/production-hardening-auth-api

permissions:
  contents: write

concurrency:
  group: remove-protected-code-query-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-auth-api

      - name: Remove URL access-code handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/product/ProductView.tsx')
          text = path.read_text()
          text = text.replace(
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import { useCallback, useMemo, useState } from "react";',
          )
          text = text.replace('  const autoCode = searchParams.get("code");\n', '')
          block = '''  useEffect(() => {\n    const firstProtectedDocument = product.protectedDocs?.[0];\n\n    if (activeTab !== "docs" || !autoCode || !firstProtectedDocument?.label) {\n      return;\n    }\n\n    const timeoutId = window.setTimeout(() => {\n      void verifyDocument(firstProtectedDocument.label, autoCode);\n    }, 0);\n\n    return () => window.clearTimeout(timeoutId);\n  }, [activeTab, autoCode, product.protectedDocs, verifyDocument]);\n\n'''
          if block not in text:
              raise SystemExit('Expected auto-code effect block was not found')
          text = text.replace(block, '')
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- src/components/product/ProductView.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/product/ProductView.tsx
          git commit -m "fix(security): stop reading protected codes from URLs"
          git push origin HEAD:agent/production-hardening-auth-api
