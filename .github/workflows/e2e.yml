name: Browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_e2e
  PAYLOAD_SECRET: e2e-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: e2e
  SMTP_PASS: e2e
  SMTP_FROM_NAME: Ertip Medikal E2E
  SMTP_FROM_ADDRESS: e2e@example.invalid
  E2E_PORT: "3100"

jobs:
  browser-flows:
    name: Mobile navigation and RFQ boundary
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply committed migrations
        run: pnpm db:migrate

      - name: Run browser tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
