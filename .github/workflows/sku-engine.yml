name: SKU Engine

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/sku-engine/**"
      - "src/collections/Products.ts"
      - "src/collections/ProductsWithSkuEngine.ts"
      - "src/payload.config.ts"
      - "tests/sku-engine/**"
      - "tsconfig.sku-tests.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/sku-engine.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/sku-engine/**"
      - "src/collections/Products.ts"
      - "src/collections/ProductsWithSkuEngine.ts"
      - "src/payload.config.ts"
      - "tests/sku-engine/**"
      - "tsconfig.sku-tests.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/sku-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sku-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterization:
    name: Legacy compatibility and safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SKU engine characterization suite
        run: pnpm test:sku
