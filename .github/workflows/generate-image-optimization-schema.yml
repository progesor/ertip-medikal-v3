name: Generate Image Optimization Schema

on:
  push:
    branches:
      - feature/m7-image-delivery-optimization
    paths:
      - .github/workflows/generate-image-optimization-schema.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URI: postgresql://payload:payload@127.0.0.1:5432/ertip_schema_generation
  PAYLOAD_SECRET: ci-only-secret-not-used-outside-github-actions
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: "1025"
  SMTP_USER: ci
  SMTP_PASS: ci
  SMTP_FROM_NAME: Ertip Medikal CI
  SMTP_FROM_ADDRESS: ci@example.invalid

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: ertip_schema_generation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ertip_schema_generation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/m7-image-delivery-optimization
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types
        run: pnpm payload:types

      - name: Apply committed baseline
        run: pnpm db:migrate

      - name: Generate image optimization migration
        run: pnpm db:migrate:create image-optimization-settings --skip-empty

      - name: Verify generated artifacts
        run: |
          git diff --check
          git status --short src/payload-types.ts src/migrations
          test -n "$(git status --porcelain src/payload-types.ts src/migrations)"

      - name: Commit generated artifacts and remove workflow
        run: |
          rm .github/workflows/generate-image-optimization-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payload-types.ts src/migrations .github/workflows/generate-image-optimization-schema.yml
          git commit -m "chore(images): commit optimization schema artifacts"
          git push origin HEAD:feature/m7-image-delivery-optimization
