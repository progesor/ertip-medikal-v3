name: M8 Add Playwright

on:
  push:
    branches:
      - agent/m8-rfq-hardening
    paths:
      - .github/workflows/m8-add-playwright.yml

permissions:
  contents: write

jobs:
  add-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/m8-rfq-hardening

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Add Playwright test dependency
        run: pnpm add -D @playwright/test

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "test(m8): add Playwright browser test dependency"
          git push origin HEAD:agent/m8-rfq-hardening
