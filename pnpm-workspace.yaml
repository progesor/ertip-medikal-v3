packages:
  - '.'

# Keep security overrides effective with both pnpm 10 and newer launchers.
overrides:
  # Upstream 4.3.1 lacks the prototype-poisoning fix (GHSA-gcqx-w48m-w2h4).
  'payload>deepmerge': 'npm:@shivammathur/deepmerge@4.3.2'
  'dompurify': '3.4.18'
  'esbuild': '0.28.2'
  'fast-uri': '3.1.9'
  'immutable@<5': '4.3.9'
  'js-yaml': '4.3.2'
  'linkify-it': '5.0.2'
  'markdown-it': '14.3.3'
  'postcss': '8.5.33'
  'sharp': '0.35.5'
  'ws': '8.23.0'
  '@lexical/headless>happy-dom': '21.0.4'
  '@typescript-eslint/typescript-estree>minimatch': '11.0.8'
  'postcss-selector-parser': '7.2.1'
  'payload>undici': '7.30.2'
  # Remove the old Sass -> Chokidar 3 -> vulnerable braces production chain.
  '@payloadcms/next>sass': '1.108.2'

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
